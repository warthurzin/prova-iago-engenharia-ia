<header><h1>Engenharia de IA: preparação para a prova</h1><p>Teoria por módulos, revisão com resposta imediata e simulados V/F e múltipla escolha</p></header>

<script>
const M=[
{n:"1. Surgimento e casos de uso",s:[
{t:"Escala e Model as a Service",p:["A principal mudança pós-2020 é a escala de modelos, dados e computação. Treinar modelos de fronteira concentra-se em poucas organizações, que oferecem modelos por API (Model as a Service), reduzindo a barreira de entrada.","GPT (2018) tinha 117 milhões de parâmetros e GPT-2 (2019), 1,5 bilhão. O que é “large” é relativo ao momento tecnológico."]},
{t:"Modelos de linguagem, tokens e self-supervision",p:["Modelo de linguagem estima os tokens mais prováveis em um contexto. Token é a unidade básica (caractere, palavra ou subpalavra); vocabulário é o conjunto de tokens representáveis.","Mascarado (ex.: BERT): prevê tokens ausentes usando contexto anterior e posterior. Autorregressivo: prevê o próximo token usando só os anteriores, ideal para geração.","Self-supervision: os rótulos são derivados do próprio dado (o próximo token). Não é o mesmo que aprendizado não supervisionado e elimina o gargalo de rotulagem.","Hierarquia: IA contém ML, que contém redes neurais; Transformers são redes baseadas em atenção; LLMs são modelos de linguagem em larga escala, hoje majoritariamente Transformers."]},
{t:"Foundation models e Engenharia de IA",p:["Foundation models servem de base a várias aplicações e incluem LLMs e modelos multimodais. A pergunta passa de “como treinar?” para “como adaptar?”.","Adaptação: prompt engineering, RAG (fontes externas) e finetuning (continuar o treino com dados específicos). Podem ser combinadas.","Engenharia de IA constrói aplicações sobre modelos existentes (selecionar, adaptar, integrar, avaliar, operar), diferente do ML Engineering tradicional, que treina modelos próprios. Decisão build vs. buy: API comercial, open source hospedado ou modelo próprio."]},
{t:"Casos de uso e risco",p:["Casos: coding, imagem e vídeo, escrita (estudo do MIT: 40% menos tempo, 18% mais qualidade), educação, bots conversacionais, agregação e organização de informação, automação e agentes.","Tarefa “exposta”: IA reduz em pelo menos 50% o tempo de execução. Empresas implantam primeiro aplicações internas e tarefas fechadas (classificação), mais fáceis de avaliar.","Responder é diferente de agir: agentes usam ferramentas e geram consequências reais, aumentando o risco. Um ótimo modelo não garante um ótimo sistema."]}]},
{n:"2. Modelos de fundação",s:[
{t:"Dados de treinamento",p:["A capacidade depende dos dados. Common Crawl e C4 são abundantes, mas trazem ruído, desinformação e viés. Mais dados não é sempre melhor: qualidade, diversidade e alinhamento ao domínio importam.","O inglês domina a web; línguas pouco representadas têm desempenho menor, e a tokenização pode exigir mais tokens para o mesmo significado. Domínios específicos (medicina, direito) exigem dados e métricas próprios."]},
{t:"Arquitetura e escala",p:["Do seq2seq com RNN (sequencial) ao Transformer, que usa atenção e processa tokens em paralelo. Atenção usa Query, Key e Value; contexto longo aumenta memória.","Bloco Transformer: atenção + MLP/feedforward, empilhado; embeddings na entrada e camada de saída sobre o vocabulário.","Três números: parâmetros (capacidade), tokens de treino e FLOPs (custo). Um modelo de 7B em 16 bits precisa de cerca de 14 GB só para os pesos.","Modelos densos usam quase todos os parâmetros; em Mixture-of-Experts cada token aciona poucos especialistas (separar parâmetros totais de ativos). Chinchilla: tokens de treino perto de 20 vezes o número de parâmetros. Gargalos: dados, energia e custo."]},
{t:"Pré-treinamento e pós-treinamento",p:["Pré-treinamento: prever tokens e capturar padrões gerais (conhecimento). Pós-treinamento alinha o modelo ao uso.","SFT: pares prompt e resposta de demonstração; transforma completador em assistente (clonagem de comportamento).","Preference finetuning: RLHF usa feedback humano, reward model e reforço; DPO otimiza diretamente preferências. Dados de comparação: prompt, resposta vencedora, resposta perdedora."]},
{t:"Sampling e saídas estruturadas",p:["O modelo gera token a token amostrando de uma distribuição. Greedy escolhe o mais provável. Temperatura alta aumenta variabilidade; baixa aumenta consistência. Top-k limita aos k mais prováveis; top-p usa o menor conjunto com probabilidade acumulada p.","Best-of-N gera várias respostas e escolhe a melhor, com custo proporcional a N.","Saída estruturada (JSON, SQL): prompting, pós-processamento, constrained sampling (gramática) e finetuning. A natureza probabilística gera inconsistência e alucinação (conteúdo não fundamentado)."]}]},
{n:"3. Práticas: Groq, visão e estruturação",s:[
{t:"API de chat da Groq",p:["client.chat.completions.create recebe model e messages com papéis system, user e assistant. Em um chat, o histórico é mantido manualmente na lista de mensagens.","Parâmetros: temperature (variação), max_completion_tokens (limite) e reasoning_effort=none (desliga raciocínio interno). Temperatura 0 para tarefas determinísticas."]},
{t:"Multimodal e modelo local",p:["Imagem é enviada como data URL em base64 dentro de image_url. O prompt pede listar o que é visível, o incerto e ilegível.","Localmente, llama_cpp carrega modelos GGUF (ex.: Qwen2.5 0.5B texto, Qwen2.5-VL 3B visão com projetor multimodal mmproj) e usa create_chat_completion."]},
{t:"O modelo não é um chatbot",p:["response_format json_object força JSON, lido com json.loads. Pydantic (BaseModel, Literal, Optional) valida o contrato na aplicação; o prompt descreve, o Pydantic valida.","Classificação zero-shot usa só instruções; few-shot inclui exemplos no prompt, sem alterar pesos. A saída do modelo alimenta regras de negócio em Python (rotas, validações), como na triagem de chamados de TI com categorias HARDWARE, SOFTWARE, REDE, ACESSO, OUTROS."]}]},
{n:"4. RAG com FAISS",s:[
{t:"Pipeline",p:["documentos, chunks, embeddings, índice FAISS, recuperação, contexto, LLM, resposta.","Chunking por palavras com tamanho 55 e overlap 12 (o início avança 43). Embeddings com paraphrase-multilingual-MiniLM-L12-v2, dimensão 384, normalizados; IndexFlatIP com vetores normalizados equivale a cosseno.","O retriever não usa LLM. Sem RAG o modelo responde sem evidência; com RAG recebe trechos citáveis como [Fonte X]."]},
{t:"Limites da busca vetorial",p:["FAISS sempre devolve os vizinhos mais próximos, mesmo sem evidência suficiente; por isso o prompt manda responder “não encontrei” e o grafo usa limiar de score.","Prompt injection: texto recuperado pode conter instruções. O contexto deve ser tratado como dado não confiável, com delimitadores e system prompt defensivo, mas isso não é isolamento de segurança; ferramentas exigem controles fora do modelo."]},
{t:"Tamanho do índice",p:["Tamanho aproximado = número de chunks × dimensão × 4 bytes (float32). Menos texto indexado gera menos chunks, menos embeddings e índice menor."]}]},
{n:"5. LangGraph e engenharia de prompt",s:[
{t:"Conceitos do LangGraph",p:["State (TypedDict) é o dado compartilhado; Node é função que recebe o estado e devolve só os campos a atualizar; Edge liga etapas; START e END marcam início e fim. Fluxo: StateGraph, add_node, add_edge, compile, invoke.","add_conditional_edges roteia conforme uma função (ex.: score_maximo maior ou igual ao limiar leva a gerar resposta; senão, nó sem evidência, sem chamar o LLM). O limiar é didático e deve ser calibrado por embedding, base e domínio.","stream com stream_mode updates mostra o que cada nó acrescenta ao estado; get_graph().draw_mermaid() mostra a estrutura."]},
{t:"Anatomia do prompt",p:["Prompt de aplicação = papel + tarefa + contexto + restrições + contrato de saída. System guarda papel e regras permanentes; user traz contexto e pergunta. Delimitadores (como contexto e pergunta entre marcas) organizam, mas não são barreira de segurança.","Zero-shot x few-shot; persona muda perspectiva e tom, não substitui contexto factual. Mais top_k não significa mais qualidade (ruído, tokens, latência) e a posição da evidência no contexto pode influenciar."]},
{t:"Decomposição, roteamento e verificação",p:["Prompt monolítico faz várias tarefas de uma vez; decomposição e chaining separam etapas, cada uma com prompt, modelo e regra próprios.","Roteamento classifica a intenção (DISCIPLINA ou FORA_DO_ESCOPO) antes da recuperação. Verificação é uma segunda chamada que checa se a resposta é sustentada pelo contexto e pode desviar para rejeição.","Prompts são versionados e avaliados em conjunto fixo de casos (qualidade, formato, abstenção, latência, tokens, robustez a injeção, estabilidade)."]}]},
{n:"6. Avaliação de RAG e compressão",s:[
{t:"Métricas de retrieval",p:["Context Recall = chunks relevantes recuperados dividido pelo total de relevantes (necessários: A e B, recuperados: A, C, D dá 0,50).","Context Precision (rank-aware): média de Precision@posição nos itens relevantes. Ranking relevante, irrelevante, relevante: (1,00 + 0,67) / 2 = 0,83.","Top-k maior tende a subir recall e baixar precision. Ambas dependem das anotações de chunks relevantes."]},
{t:"Métricas de geração e diagnóstico",p:["Faithfulness = afirmações suportadas pelo contexto dividido pelo total de afirmações (LLM juiz). Answer Relevancy: score de 0 a 1 de quanto a resposta atende à pergunta, sem avaliar factualidade.","Recall baixo: evidência não recuperada. Recall alto e precision baixa: ruído. Faithfulness baixa: gerador inventa. Relevancy baixa com fidelidade alta: resposta fiel, mas fora da pergunta. Recall e precision apontam para retrieval; faithfulness e relevancy, para generation.","Limitações: LLM juiz varia, médias escondem casos críticos; combinar com inspeção e avaliação humana."]},
{t:"Compressão orientada à recuperação",p:["Preservação literal exige compressão lossless (gzip): reduz espaço em disco, mas não tokens, chunks nem embeddings. Preservação funcional mantém evidência para responder perguntas.","Resumo genérico perde detalhes de alto valor (23h59, 48 horas, 75%, exceções, negações). Retrieval-aware preserva números, datas, condições, exceções, proibições e permissões, removendo redundância; foca em answerability.","Arquitetura híbrida: versão comprimida indexada para busca e original em gzip vinculado, recuperado sob demanda. Risco de compressão pode ser adaptativo por documento. Se as perguntas futuras são imprevisíveis, preferir preservar o original."]}]}
];

m(3,"IndexFlatIP com embeddings normalizados equivale a:",["Distância euclidiana","Similaridade de cosseno","BM25","Hash"],1,"Produto interno de vetores unitários.");
v(3,"FAISS sempre retorna vizinhos, mesmo que nenhum chunk contenha evidência suficiente.",true,"Por isso se usa limiar ou prompt de abstenção.");

const $=s=>document.querySelector(s);
const st={tab:"teoria",mod:0,list:[],ans:[],done:false,imm:true,started:false};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function nav(){
$("#nav").innerHTML=[["teoria","Teoria"],["revisao","Revisão"],["simulado","Simulado"]].map(x=>`<button class="${st.tab===x[0]?"on":""}" data-t="${x[0]}">${x[1]}</button>`).join("");
$("#nav").querySelectorAll("button").forEach(b=>b.onclick=()=>{st.tab=b.dataset.t;st.started=false;st.done=false;if(st.tab==="revisao")startRev();render()});
}
function chips(all){
return `<div class="chips">${all?`<button class="${st.mod===-1?"on":""}" data-m="-1">Todos</button>`:""}${M.map((x,i)=>`<button class="${st.mod===i?"on":""}" data-m="${i}">${x.n}</button>`).join("")}</div>`;
}
function bindChips(fn){document.querySelectorAll(".chips button").forEach(b=>b.onclick=()=>{st.mod=+b.dataset.m;fn()})}
function theory(){
const x=M[st.mod];
$("#app").innerHTML=chips(false)+`<h2>${x.n}</h2>`+x.s.map((s,i)=>`<details ${i===0?"open":""}><summary>${s.t}</summary>${s.p.map(p=>`<p>${p}</p>`).join("")}</details>`).join("");
bindChips(theory);
}
function startRev(){
const l=st.mod===-1?Q:Q.filter(q=>q.d===st.mod);
st.list=shuffle(l);st.ans=st.list.map(()=>null);st.done=false;st.imm=true;st.started=true;
}
function cards(){
return st.list.map((q,i)=>{
const show=st.imm?st.ans[i]!==null:st.done;
const opts=q.o.map((o,j)=>{
let c="o";
if(show){if(j===q.a)c+=" right";else if(st.ans[i]===j)c+=" wrong"}else if(st.ans[i]===j)c+=" sel";
return `<button class="${c}" data-i="${i}" data-j="${j}">${o}</button>`}).join("");
const ex=show?`<div class="ex">${st.ans[i]===q.a?"Correto. ":"Incorreto. "}${q.e}</div>`:"";
return `<div class="q"><div class="tag">${M[q.d].n} | ${q.t==="vf"?"Julgue a asserção":"Múltipla escolha"} | Questão ${i+1}</div><p>${q.q}</p>${opts}${ex}</div>`}).join("");
}
function score(){return st.list.reduce((s,q,i)=>s+(st.ans[i]===q.a?1:0),0)}
function quiz(){
const n=st.list.length;
let top="";
if(st.imm){const r=st.ans.filter(a=>a!==null).length;top=`<div class="bar"><span>Respondidas: ${r} de ${n}. Acertos: ${score()}</span><button class="go" id="rs">Embaralhar e reiniciar</button></div>`}
else if(st.done){const s=score();top=`<div class="res"><b>${s} de ${n}</b> (${Math.round(100*s/n)}%)<br>Revise abaixo as respostas e as explicações.</div><div class="bar"><button class="go" id="rs">Novo simulado</button></div>`}
else{const r=st.ans.filter(a=>a!==null).length;top=`<div class="bar"><span>Respondidas: ${r} de ${n}</span></div>`}
const end=(!st.imm&&!st.done)?`<button class="go" id="fin">Finalizar simulado</button>`:"";
$("#app").innerHTML=(st.tab==="revisao"?chips(true):"")+top+cards()+end;
if(st.tab==="revisao")bindChips(()=>{startRev();quiz()});
document.querySelectorAll(".o").forEach(b=>b.onclick=()=>{
const i=+b.dataset.i;
if(st.done||(st.imm&&st.ans[i]!==null))return;
st.ans[i]=+b.dataset.j;
const y=window.scrollY;quiz();window.scrollTo(0,y)});
const rs=$("#rs");if(rs)rs.onclick=()=>{if(st.imm){startRev();quiz()}else{st.started=false;st.done=false;render()}};
const f=$("#fin");if(f)f.onclick=()=>{st.done=true;quiz();window.scrollTo(0,0)};
}
function review(){quiz()}
function simSetup(){
$("#app").innerHTML=`<h2>Simulado</h2><p>Sem feedback durante a prova. O resultado e as explicações aparecem ao finalizar.</p><div class="bar"><label>Escopo <select id="sc"><option value="-1">Todos os módulos</option>${M.map((x,i)=>`<option value="${i}">${x.n}</option>`).join("")}</select></label><label>Questões <select id="nq"><option>10</option><option>20</option><option>30</option><option value="999">Todas</option></select></label><button class="go" id="go">Iniciar simulado</button></div>`;
$("#go").onclick=()=>{
const sc=+$("#sc").value,nq=+$("#nq").value;
const l=sc===-1?Q:Q.filter(q=>q.d===sc);
st.list=shuffle(l).slice(0,nq);st.ans=st.list.map(()=>null);st.done=false;st.imm=false;st.started=true;
quiz();window.scrollTo(0,0);
};
}
function render(){
nav();
if(st.tab==="teoria")theory();
else if(st.tab==="revisao"){if(!st.started)startRev();review()}
else{if(st.started&&!st.imm)quiz();else simSetup()}
}
render();
</script>
</body>
</html>
